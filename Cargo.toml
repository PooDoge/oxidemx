# Cargo workspace for the OxideMX project.
#
# Members:
#   * daemon/             — oxidemxd, the HID++ + D-Bus + KWin daemon.
#                           Pre-existing; not touched by this rewrite.
#   * oxidemx-shared/   — types shared between daemon and overlay
#                           (config.json structs, theme names, action enums).
#   * overlay-rs/         — Rust + iced overlay.
#   * settings-rs/        — Rust + iced settings GUI. Edits the same
#                           config.json the overlay watches via inotify,
#                           so changes preview live with no IPC.
#

[workspace]
resolver = "2"
members = [
    "daemon",
    "oxidemx-icons",
    "oxidemx-scene-render",
    "oxidemx-shared",
    "oxidemx-widget-api",
    "oxidemx-widget-host",
    "oxidemx-widget-proto",
    "oxidemx-widgets",
    "oxidemx-window",
    "overlay-rs",
    "oxidemx-agent",
    "popup-rs",
    "settings-rs",
    "spike-iced", "iced_gtk_themer",
    "tools/oxidemx-widget-cli",
]
exclude = ["pop_os_iced", "libcosmic", "oxidemx-widget-host/fixtures/*", "widgets/builtin/*"]

[profile.release]
# Match daemon/Cargo.toml's existing release profile so a `cargo build
# --release -p oxidemxd` from the workspace root produces an identical
# binary to the legacy `cd daemon && cargo build --release` flow.
opt-level = 3
lto = true
codegen-units = 1
