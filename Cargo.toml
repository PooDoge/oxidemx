# Cargo workspace for the OxideMX project.
#
# Members:
#   * daemon/             — oxidemxd, the HID++ + D-Bus + KWin daemon.
#                           Pre-existing; not touched by this rewrite.
#   * oxidemx-shared/   — types shared between daemon and overlay
#                           (config.json structs, theme names, action enums).
#   * overlay-rs/         — Rust + iced overlay.
#   * settings-rs/        — Rust + iced settings GUI. Edits the same
#                           config.json the overlay watches via inotify,
#                           so changes preview live with no IPC.
#

[workspace]
resolver = "2"
members = [
    "daemon",
    "oxidemx-icons",
    "oxidemx-scene-render",
    "oxidemx-shared",
    "oxidemx-widget-api",
    "oxidemx-widget-host",
    "oxidemx-widget-proto",
    "oxidemx-widgets",
    "oxidemx-window",
    "overlay-rs",
    "oxidemx-agent",
    "oxidemx-agent-core",
    "oxidemx-agent-local",
    "oxidemx-conductor",
    "oxidemx-mission-control",
    "popup-rs",
    "settings-rs",
    "spike-iced", "iced_gtk_themer",
    "tools/oxidemx-widget-cli",
]
exclude = ["pop_os_iced", "libcosmic", "oxidemx-widget-host/fixtures/*", "widgets/builtin/*", "vendor/AutoAgents"]

[profile.release]
# Match daemon/Cargo.toml's existing release profile so a `cargo build
# --release -p oxidemxd` from the workspace root produces an identical
# binary to the legacy `cd daemon && cargo build --release` flow.
opt-level = 3
lto = true
codegen-units = 1

# Vendor AutoAgents from git (the spec's "vendor & pin", §6) so we can
# use `autoagents-toolkit` + MCP, which are NOT published to crates.io
# — only the core `autoagents`/`autoagents-derive` crates are. Patching
# crates-io redirects every existing `=0.3.7` dep across the workspace
# to the v0.3.7 git tag WITHOUT editing each dep line, keeping a single
# `autoagents` source so `ToolT` (and friends) unify with the toolkit.
# Vendored locally (clone of the v0.3.7 tag, commit 5c54786) so we can
# carry a local patch: the Google (Gemini) backend's
# `chat_stream_with_tools` (live token streaming WITH function calling —
# upstream ships only the "not supported" default for Google). See
# vendor/AutoAgents/crates/autoagents-llm/src/backends/google.rs.
[patch.crates-io]
autoagents = { path = "vendor/AutoAgents/crates/autoagents" }
autoagents-derive = { path = "vendor/AutoAgents/crates/autoagents-derive" }
