[package]
name = "oxidemx-widgets"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
description = "Shared iced widgets, style closures, and palette for OxideMX UIs"
repository = "https://github.com/PooDoge/oxidemx"

[dependencies]
# Shared config types: Theme, ThemeName, parse_hex_rgba used by palette.rs.
oxidemx-shared = { path = "../oxidemx-shared" }

# Iced version pinned to match settings-rs / overlay-rs. `svg` is on for
# the shared icon set (icons.rs); the rest stays minimal so consumers
# don't pay for what they don't need.
iced = { version = "0.14", features = ["wayland", "x11", "svg"] }

# Lazy icon-handle cache (icons.rs).
once_cell = "1"
