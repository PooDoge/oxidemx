[package]
name = "oxidemx-widget-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oxidemx-widget"
path = "src/main.rs"

[dependencies]
oxidemx-widget-host = { path = "../../oxidemx-widget-host" }
oxidemx-widget-proto = { path = "../../oxidemx-widget-proto" }
clap = { version = "4", features = ["derive"] }
zip = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
