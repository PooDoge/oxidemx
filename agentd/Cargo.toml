[package]
name = "agentd"
version = "0.0.1"
edition = "2021"

[features]
default = []
mistral = ["oxidemx-agent-local/mistral"]

[dependencies]
oxidemx-shared = { path = "../oxidemx-shared" }
oxidemx-agent-core = { path = "../oxidemx-agent-core" }
oxidemx-conductor = { path = "../oxidemx-conductor" }
oxidemx-agent-local = { path = "../oxidemx-agent-local" }
oxidemx-agent-proxy = { path = "../oxidemx-agent-proxy" }
zbus = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3"
