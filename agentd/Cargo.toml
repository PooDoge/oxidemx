[package]
name = "agentd"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "oxidemx-agentd"
path = "src/main.rs"

[features]
default = []
mistral = ["oxidemx-agent-local/mistral"]

[dependencies]
oxidemx-shared = { path = "../oxidemx-shared" }
oxidemx-planner = { path = "../oxidemx-planner" }
oxidemx-agent = { path = "../oxidemx-agent" }   # keys::provider_key (file-based API keys)
oxidemx-agent-core = { path = "../oxidemx-agent-core" }
oxidemx-harness = { path = "../oxidemx-harness" }
oxidemx-conductor = { path = "../oxidemx-conductor" }
oxidemx-agent-local = { path = "../oxidemx-agent-local" }
oxidemx-agent-proxy = { path = "../oxidemx-agent-proxy" }
oxidemx-approval = { path = "../oxidemx-approval" }
# tokio executor (not the default async-io) so `tokio::spawn` works inside
# zbus interface handlers (e.g. StreamBridge's drain task on a chat turn).
zbus = { version = "5", default-features = false, features = ["tokio", "blocking-api"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
