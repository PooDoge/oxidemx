[package]
name = "agentd"
version = "0.0.1"
edition = "2021"

[[bin]]
name = "oxidemx-agentd"
path = "src/main.rs"

[features]
default = []
mistral = ["oxidemx-agent-local/mistral"]

[dependencies]
oxidemx-shared = { path = "../oxidemx-shared" }
oxidemx-agent-core = { path = "../oxidemx-agent-core" }
oxidemx-conductor = { path = "../oxidemx-conductor" }
oxidemx-agent-local = { path = "../oxidemx-agent-local" }
oxidemx-agent-proxy = { path = "../oxidemx-agent-proxy" }
zbus = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tokio-util = "0.7"
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
