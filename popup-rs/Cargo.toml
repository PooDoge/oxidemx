[package]
name = "juhradial-popup-rs"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
description = "JuhRadial MX indicator-popup (Rust + iced) - spawned by juhradiald on ShowPopup"
repository = "https://github.com/JuhLabs/juhradial-mx"

[[bin]]
name = "juhradial-popup"
path = "src/main.rs"

[dependencies]
juhradial-shared = { path = "../juhradial-shared" }
juhradial-widgets = { path = "../juhradial-widgets" }
juhradial-window = { path = "../juhradial-window" }

iced = { version = "0.14", features = ["canvas", "wayland", "x11", "tokio", "image"] }

# D-Bus client for talking to the daemon.
zbus = "5"
async-channel = "2"
futures-util = "0.3"

# Async runtime + subprocess for wpctl.
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync"] }

# Config IO and inotify watcher.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

# GSettings via gtk-rs.
gio = { version = "0.20", features = ["v2_74"] }
glib = "0.20"

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI arg parsing for --panel-rect.
clap = { version = "4", features = ["derive"] }
