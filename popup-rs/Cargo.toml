[package]
name = "oxidemx-popup"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0"
description = "OxideMX indicator-popup (Rust + iced) - spawned by oxidemxd on ShowPopup"
repository = "https://github.com/JuhLabs/oxidemx"

[[bin]]
name = "oxidemx-popup"
path = "src/main.rs"

[dependencies]
oxidemx-shared = { path = "../oxidemx-shared" }
oxidemx-widgets = { path = "../oxidemx-widgets" }
oxidemx-window = { path = "../oxidemx-window" }

iced = { version = "0.14", features = ["canvas", "wayland", "x11", "tokio", "image"] }

# D-Bus client for talking to the daemon.
zbus = "5"
async-channel = "2"
futures-util = "0.3"

# Async runtime + subprocess for wpctl.
tokio = { version = "1", features = ["rt", "macros", "time", "process", "sync"] }

# Config IO and inotify watcher.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

# Logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI arg parsing for --panel-rect.
clap = { version = "4", features = ["derive"] }
