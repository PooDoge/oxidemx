<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- RAM stick -->
  <rect x="6" y="14" width="36" height="16" rx="2" fill="none" stroke="#9ECE6A" stroke-width="2.5"/>
  <!-- Chips -->
  <g fill="#9ECE6A">
    <rect x="11" y="19" width="6" height="6" rx="1"/>
    <rect x="21" y="19" width="6" height="6" rx="1"/>
    <rect x="31" y="19" width="6" height="6" rx="1"/>
  </g>
  <!-- Edge connector pins -->
  <g stroke="#9ECE6A" stroke-width="2.5" stroke-linecap="round">
    <line x1="12" y1="31" x2="12" y2="35"/>
    <line x1="20" y1="31" x2="20" y2="35"/>
    <line x1="28" y1="31" x2="28" y2="35"/>
    <line x1="36" y1="31" x2="36" y2="35"/>
  </g>
</svg>
