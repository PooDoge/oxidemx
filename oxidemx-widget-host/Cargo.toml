# Host side of the widget plugin system: registry over the install dir,
# wasmi instance lifecycle, and the worker + permission-gated http cache.

[package]
name = "oxidemx-widget-host"
version = "0.1.0"
edition = "2021"

[dependencies]
oxidemx-widget-proto = { path = "../oxidemx-widget-proto" }
oxidemx-shared = { path = "../oxidemx-shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
wasmi = "1.0.9"
postcard = { version = "1.1.3", features = ["alloc"] }
wasmi_wasi = "1.0.9"
# Worker runtime — versions mirror overlay-rs (tokio 1, async-channel 2,
# reqwest 0.12 rustls).
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
async-channel = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }
