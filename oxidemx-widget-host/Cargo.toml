# Host side of the widget plugin system: registry over the install dir,
# wasmi instance lifecycle, and (later tasks) the worker + http cache.

[package]
name = "oxidemx-widget-host"
version = "0.1.0"
edition = "2021"

[dependencies]
oxidemx-widget-proto = { path = "../oxidemx-widget-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
