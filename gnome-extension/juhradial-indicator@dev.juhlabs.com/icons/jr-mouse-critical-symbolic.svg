<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <g fill="#bebebe">
    <!-- mouse body -->
    <path d="M 8 1.5
             C 5.6 1.5 4 3.5 4 6
             L 4 11
             C 4 13 5.6 14.5 8 14.5
             C 10.4 14.5 12 13 12 11
             L 12 6
             C 12 3.5 10.4 1.5 8 1.5
             Z" />
    <!-- scroll wheel -->
    <rect x="7.5" y="3.5" width="1" height="2.5" rx="0.5" fill="#bebebe" />
  </g>
  <!-- critical indicator: X mark on the mouse body -->
  <line x1="6" y1="9" x2="10" y2="13"
        stroke="#bebebe" stroke-width="0.8" stroke-linecap="round" />
  <line x1="10" y1="9" x2="6" y2="13"
        stroke="#bebebe" stroke-width="0.8" stroke-linecap="round" />
</svg>
