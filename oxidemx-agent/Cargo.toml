# OxideMX agent runtime (P0 spike).
#
# Pins AutoAgents at exactly 0.3.7 — the version whose trait surface
# the integration spec (docs/plans/agent-framework-integration-
# brainstorm.md) was written against. default-features = false pulls
# zero provider backends: the Gemini Interactions transport lives in
# this crate (src/provider/), not upstream.
[package]
name = "oxidemx-agent"
version = "0.1.0"
edition = "2021"
description = "AutoAgents-based agent runtime for OxideMX (P0 spike: Gemini Interactions provider + execute_command tool + ReAct CLI harness)"

[dependencies]
oxidemx-shared = { path = "../oxidemx-shared" }
autoagents = { version = "=0.3.7", default-features = false, features = ["google", "openai", "anthropic", "ollama"] }
autoagents-derive = "=0.3.7"
# The toolkit (filesystem/search/document-parsing/MCP tools) is git-only
# — see the workspace [patch.crates-io] note. Same v0.3.7 tag so its
# `autoagents` resolves to the patched single source.
autoagents-toolkit = { git = "https://github.com/liquidos-ai/AutoAgents", tag = "v0.3.7", default-features = false, features = ["filesystem", "search", "document-parsing", "mcp"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync"] }
tokio-util = "0.7"
futures-util = "0.3"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "oxidemx-agent-cli"
path = "src/bin/cli.rs"
