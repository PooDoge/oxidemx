[package]
name = "oxidemx-overlay"
version = "0.0.1"
edition = "2021"
description = "OxideMX radial-menu overlay (Rust + iced + xdg-shell)"
license = "GPL-3.0"
repository = "https://github.com/PooDoge/oxidemx"

[[bin]]
name = "oxidemx-overlay"
path = "src/main.rs"

[dependencies]
oxidemx-shared = { path = "../oxidemx-shared" }
oxidemx-icons = { path = "../oxidemx-icons" }
oxidemx-window = { path = "../oxidemx-window" }
# Widget plugin runtime: the wasmi host worker + the wire types the
# painter replays (Scene/Prim/WedgeGeom).
oxidemx-widget-host = { path = "../oxidemx-widget-host" }
oxidemx-widget-proto = { path = "../oxidemx-widget-proto" }
# REST client for Interactions API
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
url = "2"
percent-encoding = "2"
once_cell = "1"

# UI: iced 0.14 with canvas drawing + Wayland (xdg-shell via winit) +
# X11 fallback. We rejected gtk4 + gtk4-layer-shell after confirming
# Mutter doesn't advertise wlr-layer-shell on stable GNOME (verified
# via wayland-info from the dev distrobox), and keeping the build
# pure-Rust avoids the *-devel rpm-ostree pain on atomic Fedora.
iced = { version = "0.14", features = ["canvas", "wayland", "x11", "tokio", "image", "markdown", "highlighter"] }
# Direct wgpu access for the aurora backdrop shader. Versions
# pinned to whatever iced_wgpu 0.14 itself uses so the wgpu
# device/queue handed in by iced are ABI-compatible — bumping
# iced means bumping these in lockstep.
wgpu = "27.0"
bytemuck = { version = "1.0", features = ["derive"] }

# IPC with the daemon (signals on org.oxidemx.Daemon) and with the
# GNOME shell extension (window positioning).
zbus = "5"
async-channel = "2"
futures-util = "0.3"
# "process" backs the agent's execute_command tool (sh -c with a
# kill-on-timeout, which std::process can't do without threads).
tokio = { version = "1", features = ["rt", "macros", "time", "fs", "process"] }

# Image loading for slice icons. iced::widget::svg + the `image`
# crate cover SVG/PNG/JPEG; tiny-skia rasterises SVGs through resvg
# when iced isn't doing it itself.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.44"
tiny-skia = "0.11"

# Config + serde-json (re-exported via oxidemx-shared but kept
# direct here for the editor's mutable JSON manipulation).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config inotify watcher — mirrors what daemon uses.
notify = "6"

[dev-dependencies]
naga = { version = "27.0", features = ["wgsl-in"] }
