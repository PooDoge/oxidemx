[package]
name = "juhradial-overlay-rs"
version = "0.0.1"
edition = "2021"
description = "JuhRadial MX radial-menu overlay (Rust + iced + xdg-shell)"
license = "GPL-3.0"
repository = "https://github.com/JuhLabs/juhradial-mx"

[[bin]]
name = "juhradial-overlay-rs"
path = "src/main.rs"

[dependencies]
juhradial-shared = { path = "../juhradial-shared" }
juhradial-icons = { path = "../juhradial-icons" }
juhradial-window = { path = "../juhradial-window" }

# UI: iced 0.14 with canvas drawing + Wayland (xdg-shell via winit) +
# X11 fallback. We rejected gtk4 + gtk4-layer-shell after confirming
# Mutter doesn't advertise wlr-layer-shell on stable GNOME (verified
# via wayland-info from the dev distrobox), and keeping the build
# pure-Rust avoids the *-devel rpm-ostree pain on atomic Fedora.
iced = { version = "0.14", features = ["canvas", "wayland", "x11", "tokio", "image"] }

# IPC with the daemon (signals on org.juhradial.Daemon) and with the
# GNOME shell extension (window positioning).
zbus = "5"
async-channel = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "macros", "time"] }

# Image loading for slice icons. iced::widget::svg + the `image`
# crate cover SVG/PNG/JPEG; tiny-skia rasterises SVGs through resvg
# when iced isn't doing it itself.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.44"
tiny-skia = "0.11"

# Config + serde-json (re-exported via juhradial-shared but kept
# direct here for the editor's mutable JSON manipulation).
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config inotify watcher — mirrors what daemon uses.
notify = "6"
