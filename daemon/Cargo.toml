[package]
name = "oxidemx-daemon"
version = "0.3.2"
edition = "2021"
description = "OxideMX daemon - Radial menu for Logitech MX Master 4 on Linux"
license = "GPL-3.0"
authors = ["Julian Hermstad"]
repository = "https://github.com/PooDoge/oxidemx"

[[bin]]
name = "oxidemxd"
path = "src/main.rs"

[lib]
name = "oxidemxd"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

# D-Bus IPC (pure Rust, async)
zbus = "5"

# Linux input events
evdev = { version = "0.13", features = ["tokio"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared config types (serde-only crate — adds no transitive deps).
# Used for the gaming-mode config block; over time the daemon's
# hand-rolled config mirrors should migrate onto these.
oxidemx-shared = { path = "../oxidemx-shared" }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# File watching for config hot-reload
notify = "6"

# Platform directories (config, data paths)
dirs = "5"

# Low-level libc bindings (for O_NONBLOCK)
libc = "0.2"

# Temporary files for KWin scripts
tempfile = "3"

# HID++ for haptic feedback (optional - now uses direct hidraw instead)
# hidapi = { version = "2", optional = true }

[features]
default = []
# Legacy hidapi support (not needed - we use direct hidraw access now)
# hidapi = ["dep:hidapi"]

[dev-dependencies]
# Performance benchmarks
criterion = "0.5"

[[bench]]
name = "latency"
harness = false

# [profile.release] moved to the workspace root Cargo.toml so the
# settings apply uniformly across daemon, oxidemx-shared, and
# overlay-rs (Cargo only honours [profile.*] in workspace members'
# Cargo.toml warnings otherwise).
