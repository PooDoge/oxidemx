[package]
name = "oxide-freya"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "oxide-freya"
path = "src/main.rs"

[features]
# Opt-in Freya devtools (real-time component-tree inspector inside the window).
# Run with: LIBRARY_PATH=/tmp/oxidemx-lib-links cargo run -p oxide-freya --bin oxide-freya --features devtools
# Kept off by default so the normal build is unaffected.
devtools = ["freya/devtools"]

[dependencies]
freya = { workspace = true }
oxide-client = { path = "../oxide-client" }
oxide-ui = { path = "../oxide-ui" }
freya-icons = { workspace = true }
base64 = "0.22"
tokio = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
freya-testing = { workspace = true }
