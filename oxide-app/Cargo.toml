[workspace]
resolver = "2"
members = ["crates/oxide-client", "crates/oxide-ui", "crates/oxide-freya"]

[workspace.dependencies]
freya = { path = "/run/media/system/fastdrive/repos/freya-blog04/crates/freya" }
freya-testing = { path = "/run/media/system/fastdrive/repos/freya-blog04/crates/freya-testing" }
freya-icons = { path = "/run/media/system/fastdrive/repos/freya-blog04/crates/freya-icons", features = ["lucide"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
futures-util = "0.3"
arboard = "3"
image = "0.25"
